name: diag

# Diagnostic only, never merged: measures the Windows process broker on a hosted runner.
on:
  push:
    branches: [diag/windows-broker]

jobs:
  diag:
    runs-on: windows-latest
    env:
      GOFLAGS: -p=4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet and build, as the check does
        run: go vet ./... && go build ./...
      - name: every package at once, as the check does, with the broker timed first in cmd/adad
        env:
          ADA_DIAG: "1"
        run: go test -count=1 -v -timeout 40m ./... > full.log 2>&1; echo "exit=$?"; grep -E "^(ok|FAIL|---)|aaa_diag|=== (deny|nojob|allow)| ms  |brokerDetached|launcher|adad:" full.log | grep -v -E "^--- PASS" | cut -c1-220
      - name: cmd/adad alone afterwards
        if: always()
        env:
          ADA_DIAG: "1"
        run: go test -count=1 -v -timeout 20m ./cmd/adad/ > alone.log 2>&1; echo "exit=$?"; grep -E "^(ok|FAIL|---)|aaa_diag|=== (deny|nojob|allow)| ms  |brokerDetached|launcher|adad:" alone.log | grep -v -E "^--- PASS" | cut -c1-220
