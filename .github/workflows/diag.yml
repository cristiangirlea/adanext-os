name: diag

# Diagnostic only, never merged: runs the Go tests on a hosted Windows runner as the check does.
on:
  push:
    branches: [diag/windows-broker]

jobs:
  diag:
    runs-on: windows-latest
    env:
      GOFLAGS: -p=4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet and build, as the check does
        run: go vet ./... && go build ./...
      - name: go test, every package at once, as the check does
        run: go test -count=1 -v ./... > full.log 2>&1; code=$?; grep -E "^(ok|FAIL)|^--- FAIL|first PowerShell|Broker|DesktopJob|launcher|did not finish|could not start" full.log | cut -c1-220; exit $code
