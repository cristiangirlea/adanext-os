name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on Linux; every push to main tests Windows too.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    # The repository is public, so it runs on GitHub's runners, free for public repositories: the
    # owner's rule keeps the lab runners for private repositories (a stranger's pull request must
    # never reach them) and sends everything public here. Nothing to configure, nothing to skip.
    runs-on: ${{ matrix.os }}
    env:
      # Build at most four Go packages at once: the SQLite driver is a large package to compile.
      GOFLAGS: -p=4
    # bash on every OS: the step scripts are bash, and GitHub's Windows runner has Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ui/package-lock.json
      - name: Electron virtual display
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Typecheck, Vitest and Playwright (workers capped), and both builds run inside check.sh,
      # after the Go steps and the two lockfile installs.
      - name: everything scripts/check.sh runs
        run: bash scripts/check.sh
