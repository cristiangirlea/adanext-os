name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on Linux only; every push to main tests Windows too.
        os: ${{ github.event_name == 'push' && fromJSON('["linux", "windows"]') || fromJSON('["linux"]') }}
    # Linux runs on the owner's runner, the local cluster's lab-adanext-os scale set (CI_RUNNER).
    # The repository is public, so two legs go to GitHub's runners, free for public repositories:
    # a pull request from a fork, which must never reach the owner's runner and which the cluster
    # holds for approval, and the Windows leg, because the owner's Windows runner serves private
    # repositories only. Without CI_RUNNER the job is skipped, and a skipped job is not a pass.
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest') }}
    env:
      # The lab runner's container sees the node's 24 CPUs within a 3 GiB memory limit; the SQLite
      # driver is a large package to compile, so build at most four packages at once.
      GOFLAGS: -p=4
    # bash on every OS: the step scripts are bash, and GitHub's Windows runner has Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: desktop/.nvmrc
      - name: everything scripts/check.sh runs
        run: bash scripts/check.sh
